<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">2penheimer, full-stack engineer</title>
  <desc id="desc">A request moving through the interface, API, service, and data layers.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1c2944" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="16" fill="#0b1020"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="#243044" stroke-width="2"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <circle cx="64" cy="68" r="4" fill="#7dd3fc">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="80" y="73" fill="#8ea3c4" font-size="14" font-weight="700" letter-spacing="2.2">FULL-STACK ENGINEER</text>

    <text x="64" y="132" fill="#f4f7fb" font-size="52" font-weight="700">2penheimer</text>
    <text x="64" y="176" fill="#d5deea" font-size="22">From the interface to the service.</text>
    <text x="64" y="208" fill="#8ea3c4" font-size="18">Services, interfaces, realtime, and agents.</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="692" y="52" fill="#7185a8" font-size="12" font-weight="700" letter-spacing="1.6">REQUEST PATH</text>

    <line x1="668" y1="94" x2="668" y2="286" stroke="#243044" stroke-width="2"/>
    <line x1="668" y1="94" x2="668" y2="286" stroke="url(#rail)" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="22" to="0" dur="1.1s" repeatCount="indefinite"/>
    </line>

    <g>
      <rect x="692" y="68" width="444" height="52" rx="8" fill="#121a2e" stroke="#7dd3fc" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="1;0.25;0.25;0.25;1" keyTimes="0;0.2;0.55;0.8;1" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <text x="712" y="100" fill="#f4f7fb" font-size="16" font-weight="650">Interface</text>
      <text x="1116" y="100" fill="#8ea3c4" font-size="14" text-anchor="end">React, Next.js</text>
    </g>
    <g>
      <rect x="692" y="132" width="444" height="52" rx="8" fill="#121a2e" stroke="#7dd3fc" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.25;1;0.25;0.25;0.25" keyTimes="0;0.25;0.45;0.75;1" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <text x="712" y="164" fill="#f4f7fb" font-size="16" font-weight="650">API</text>
      <text x="1116" y="164" fill="#8ea3c4" font-size="14" text-anchor="end">Go</text>
    </g>
    <g>
      <rect x="692" y="196" width="444" height="52" rx="8" fill="#121a2e" stroke="#34d399" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.25;0.25;1;0.25;0.25" keyTimes="0;0.3;0.5;0.7;1" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <text x="712" y="228" fill="#f4f7fb" font-size="16" font-weight="650">Service</text>
      <text x="1116" y="228" fill="#8ea3c4" font-size="14" text-anchor="end">Spring Boot</text>
    </g>
    <g>
      <rect x="692" y="260" width="444" height="52" rx="8" fill="#121a2e" stroke="#34d399" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.25;0.25;0.25;1;0.25" keyTimes="0;0.45;0.6;0.75;1" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <text x="712" y="292" fill="#f4f7fb" font-size="16" font-weight="650">Data</text>
      <text x="1116" y="292" fill="#8ea3c4" font-size="14" text-anchor="end">Postgres, Redis</text>
    </g>

    <circle r="6" fill="#f4f7fb" filter="url(#glow)">
      <animate attributeName="cx" values="668;668" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="94;158;222;286;222;158;94" keyTimes="0;0.16;0.33;0.5;0.66;0.83;1" dur="4.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
